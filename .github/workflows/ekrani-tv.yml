name: Екрани TV приложение

on:
  push:
    paths: ['ekrani/android/**', '.github/workflows/ekrani-tv.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: Сглоби APK
        working-directory: ekrani/android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: gradle --no-daemon assembleRelease
      - run: cp ekrani/android/app/build/outputs/apk/release/app-release.apk ekrani-tv.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: tv-app-${{ github.run_number }}
          name: Екрани TV ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: ekrani-tv.apk
          make_latest: true
