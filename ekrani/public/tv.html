<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Екран</title>
<link rel="icon" href="/static/icon.png">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:none}
  #stage{position:absolute;inset:0;overflow:hidden;perspective:2000px}
  .slot{position:absolute;inset:0;opacity:0;overflow:hidden;backface-visibility:hidden;will-change:opacity,transform}
  .slot img,.slot video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
  body.cover .slot img,body.cover .slot video{object-fit:cover}
  #logo{position:absolute;right:2.2vw;top:2.2vw;width:8.5vw;opacity:.92;filter:drop-shadow(0 .15vw .5vw rgba(0,0,0,.55)) drop-shadow(0 0 .2vw rgba(0,0,0,.35));z-index:5;display:none}
  body.logo #logo{display:block}
  #msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1.4vw;
    color:#cfd3d6;font:600 2.2vw/1.3 -apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;background:radial-gradient(ellipse at center,#2a2421 0,#000 70%)}
  #msg[hidden]{display:none}
  #msg img{width:18vw;opacity:.95}
  #msg small{font-size:1.2vw;font-weight:400;opacity:.6}
  #tap{position:absolute;right:2vw;bottom:2vw;color:#fff;background:rgba(0,0,0,.6);padding:.6vw 1.2vw;border-radius:1vw;
    font:500 1.2vw -apple-system,"Segoe UI",Roboto,sans-serif;display:none;z-index:6}
</style>
</head>
<body>
<div id="stage"><div class="slot" id="s0"></div><div class="slot" id="s1"></div></div>
<img id="logo" src="/static/logo-white.png" alt="">
<div id="msg" hidden></div>
<div id="tap">Натисни OK за звук</div>
<script>
(() => {
  const ID = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop() || '1');
  const Q = new URLSearchParams(location.search);
  const PREVIEW = Q.has('preview');           // прегледът в админа — не се брои за телевизор, без звук
  const POLL = PREVIEW ? 10000 : 30000;
  const slots = [document.getElementById('s0'), document.getElementById('s1')];
  const msg = document.getElementById('msg');
  let cur = 0, list = [], key = '', pending = null, idx = -1, timer = null;
  let cfg = { sound: false, transition: 'fade', tdur: 1, kenburns: true };
  let currentName = '', started = Date.now(), first = true;

  function say(t, sub) {
    msg.hidden = !t; msg.innerHTML = ''; if (!t) return;
    const l = document.createElement('img'); l.src = '/static/logo-white.png'; l.alt = ''; msg.appendChild(l);
    const a = document.createElement('div'); a.textContent = t; msg.appendChild(a);
    if (sub) { const b = document.createElement('small'); b.textContent = sub; msg.appendChild(b); }
  }

  async function load() {
    try {
      const r = await fetch('/api/play/' + encodeURIComponent(ID), { cache: 'no-store' });
      if (r.status === 404) { say('Няма екран ' + ID, 'Провери номера в админ страницата'); return; }
      const j = await r.json();
      document.title = j.name || 'Екран';
      document.body.classList.toggle('cover', j.fit === 'cover');
      document.body.classList.toggle('logo', !!j.logo);
      cfg = { sound: !!j.sound && !PREVIEW, transition: j.transition || 'fade', tdur: j.tdur || 1, kenburns: j.kenburns !== false };
      if (j.key !== key) {
        key = j.key;
        if (!list.length) { list = j.items; idx = -1; if (list.length) { say(''); next(); } else say(j.name, 'Няма пуснато съдържание'); }
        else pending = j.items; // смяната става между два клипа
      }
    } catch (e) { if (!list.length) say('Няма връзка', 'Опитвам пак…'); }
  }
  function ping() {
    if (PREVIEW) return;
    fetch('/api/play/' + encodeURIComponent(ID) + '/ping', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ current: currentName }) }).catch(() => {});
  }

  function clearSlot(el) {
    el.getAnimations({ subtree: true }).forEach(a => a.cancel());
    el.querySelectorAll('video').forEach(v => { v.pause(); v.removeAttribute('src'); v.load(); });
    el.innerHTML = '';
    el.style.cssText = '';
  }

  function next() {
    clearTimeout(timer);
    if (pending) {
      list = pending; pending = null; idx = -1;
      if (!list.length) { slots.forEach(clearSlot); say(document.title, 'Няма пуснато съдържание'); return; }
      say('');
    }
    if (Date.now() - started > 12 * 3600e3) { location.reload(); return; } // чиста памет веднъж на 12 ч
    if (!list.length) return;
    idx = (idx + 1) % list.length;
    show(list[idx]);
  }

  /* ---------- преходи ---------- */
  const T = {
    fade:  { in: [{ opacity: 0 }, { opacity: 1 }], out: [{ opacity: 1 }, { opacity: 0 }] },
    slide: { in: [{ opacity: 1, transform: 'translateX(100%)' }, { opacity: 1, transform: 'translateX(0)' }],
             out: [{ opacity: 1, transform: 'translateX(0)' }, { opacity: 1, transform: 'translateX(-100%)' }] },
    up:    { in: [{ opacity: 1, transform: 'translateY(100%)' }, { opacity: 1, transform: 'translateY(0)' }],
             out: [{ opacity: 1, transform: 'translateY(0)' }, { opacity: 1, transform: 'translateY(-100%)' }] },
    zoom:  { in: [{ opacity: 0, transform: 'scale(1.18)' }, { opacity: 1, transform: 'scale(1)' }],
             out: [{ opacity: 1, transform: 'scale(1)' }, { opacity: 0, transform: 'scale(.88)' }] },
    blur:  { in: [{ opacity: 0, filter: 'blur(40px)' }, { opacity: 1, filter: 'blur(0)' }],
             out: [{ opacity: 1, filter: 'blur(0)' }, { opacity: 0, filter: 'blur(40px)' }] },
    wipe:  { in: [{ opacity: 1, clipPath: 'inset(0 100% 0 0)' }, { opacity: 1, clipPath: 'inset(0 0 0 0)' }], out: null },
    black: { in: [{ opacity: 0, offset: 0 }, { opacity: 0, offset: .5 }, { opacity: 1, offset: 1 }],
             out: [{ opacity: 1, offset: 0 }, { opacity: 0, offset: .5 }, { opacity: 0, offset: 1 }] },
    flip:  { in: [{ opacity: 0, transform: 'rotateY(-90deg)', offset: 0 }, { opacity: 0, transform: 'rotateY(-90deg)', offset: .5 }, { opacity: 1, transform: 'rotateY(0)', offset: 1 }],
             out: [{ opacity: 1, transform: 'rotateY(0)', offset: 0 }, { opacity: 1, transform: 'rotateY(90deg)', offset: .5 }, { opacity: 0, transform: 'rotateY(90deg)', offset: 1 }] },
  };
  const RANDOM = ['fade', 'slide', 'up', 'zoom', 'blur', 'wipe', 'black', 'flip'];
  let lastRandom = '';

  function transition(inEl, outEl, kind) {
    if (kind === 'random') { do { kind = RANDOM[Math.floor(Math.random() * RANDOM.length)]; } while (kind === lastRandom); lastRandom = kind; }
    const ms = first || kind === 'cut' || !T[kind] ? 0 : Math.round(cfg.tdur * 1000);
    first = false;
    inEl.style.zIndex = 2; outEl.style.zIndex = 1;
    if (!ms) { inEl.style.opacity = 1; outEl.style.opacity = 0; return 0; }
    const opt = { duration: ms, easing: 'cubic-bezier(.65,0,.35,1)', fill: 'both' };
    const a = inEl.animate(T[kind].in, opt);
    if (T[kind].out) outEl.animate(T[kind].out, opt);
    a.onfinish = () => { inEl.style.opacity = 1; inEl.getAnimations().forEach(x => x.cancel()); };
    return ms;
  }

  function show(item) {
    const nextSlot = slots[1 - cur], oldSlot = slots[cur];
    clearSlot(nextSlot);
    currentName = item.name; ping();
    let shown = false;
    const reveal = () => {
      if (shown) return; shown = true;
      const ms = transition(nextSlot, oldSlot, item.transition || cfg.transition);
      cur = 1 - cur;
      setTimeout(() => { if (slots[1 - cur] === oldSlot) clearSlot(oldSlot); }, ms + 100);
    };
    if (item.type === 'image') {
      const img = new Image();
      img.onload = () => {
        reveal();
        if (cfg.kenburns) { // бавно приближаване — снимката „живее“
          const o = ['50% 50%', '30% 40%', '70% 40%', '40% 65%', '60% 60%'][Math.floor(Math.random() * 5)];
          img.style.transformOrigin = o;
          img.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.08)' }], { duration: item.seconds * 1000 + 2000, easing: 'linear', fill: 'both' });
        }
        timer = setTimeout(next, item.seconds * 1000);
      };
      img.onerror = () => { timer = setTimeout(next, 1000); };
      img.src = item.url;
      nextSlot.appendChild(img);
    } else {
      const v = document.createElement('video');
      v.playsInline = true; v.preload = 'auto';
      v.muted = !cfg.sound || !unlocked;
      v.src = item.url;
      nextSlot.appendChild(v);
      const guard = setTimeout(next, 20000); // не тръгва до 20 сек — следващото
      v.onplaying = () => { clearTimeout(guard); reveal();
        if (isFinite(v.duration)) { clearTimeout(timer); timer = setTimeout(next, (v.duration + 5) * 1000); } };
      v.onended = () => { clearTimeout(guard); next(); };
      v.onerror = () => { clearTimeout(guard); timer = setTimeout(next, 1000); };
      const p = v.play();
      if (p && p.catch) p.catch(() => { v.muted = true; v.play().catch(() => {}); if (cfg.sound) showTap(); });
    }
  }

  // Браузърът позволява звук само след натискане; в приложението за телевизора е разрешен от самото начало
  let unlocked = Q.get('app') === '1';
  function showTap() { if (!unlocked && !PREVIEW) document.getElementById('tap').style.display = 'block'; }
  function unlock() {
    if (PREVIEW) return;
    unlocked = true; document.getElementById('tap').style.display = 'none';
    const el = document.documentElement;
    if (!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen().catch(() => {});
    if (cfg.sound) document.querySelectorAll('video').forEach(v => { v.muted = false; });
  }
  addEventListener('keydown', unlock); addEventListener('click', unlock);

  async function wake() { try { if (navigator.wakeLock && !PREVIEW) await navigator.wakeLock.request('screen'); } catch (e) {} }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) wake(); });
  wake();

  load(); ping();
  setInterval(load, POLL);
  setInterval(ping, 30000);
})();
</script>
</body>
</html>
