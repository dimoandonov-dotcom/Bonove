<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Екрани · 300</title>
<link rel="icon" href="/static/icon.png">
<link rel="apple-touch-icon" href="/static/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Оформление: тъмна лента с логото, телевизорите като карти най-горе,
   отдолу списъкът за избрания екран и страничен панел с жив преглед и настройки. */
:root{
  --brand:#F37F28; --brand-ink:#C2580F; --brand-soft:#FDEBDC;
  --bg:#F4F2EF; --surface:#FFFFFF; --sunk:#EEEAE5; --line:#E4DED7; --ink:#1E1A17; --muted:#6F665E;
  --bar:#1E1A17; --bar-ink:#F6F1EC;
  --ok:#1E8E55; --ok-soft:#E2F4EA; --warn:#B26A00; --warn-soft:#FCEFD7; --bad:#C0392B; --bad-soft:#FBE6E3;
  --shadow:0 1px 2px rgba(30,26,23,.06),0 8px 24px -12px rgba(30,26,23,.18);
  --f-display:"Rubik","Manrope",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --brand:#FF8D3A; --brand-ink:#FFA562; --brand-soft:#3A2617;
  --bg:#12100E; --surface:#1C1916; --sunk:#16130F; --line:#2D2823; --ink:#F3EEE9; --muted:#A39A91;
  --bar:#0B0A09; --bar-ink:#F6F1EC;
  --ok:#4CC584; --ok-soft:#163223; --warn:#E6A23C; --warn-soft:#33270F; --bad:#F0705F; --bad-soft:#3A1C18;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --brand:#FF8D3A; --brand-ink:#FFA562; --brand-soft:#3A2617;
  --bg:#12100E; --surface:#1C1916; --sunk:#16130F; --line:#2D2823; --ink:#F3EEE9; --muted:#A39A91;
  --bar:#0B0A09; --bar-ink:#F6F1EC;
  --ok:#4CC584; --ok-soft:#163223; --warn:#E6A23C; --warn-soft:#33270F; --bad:#F0705F; --bad-soft:#3A1C18;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7); color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;font-feature-settings:"locl" 0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* лента */
.bar{position:sticky;top:0;z-index:20;background:var(--bar);color:var(--bar-ink);
  padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.bar-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:14px}
.bar img{height:38px;display:block}
.bar .ttl{font:700 15px var(--f-display);letter-spacing:.02em;padding-left:14px;border-left:1px solid rgba(255,255,255,.18)}
.bar .ttl small{display:block;font:500 11.5px var(--f-body);letter-spacing:.08em;text-transform:uppercase;opacity:.6}
.bar .sp{flex:1}
.meter{display:flex;align-items:center;gap:10px;font-size:12.5px;opacity:.85}
.meter .m{width:110px;height:6px;border-radius:3px;background:rgba(255,255,255,.15);overflow:hidden}
.meter .m i{display:block;height:100%;background:var(--brand)}
.barbtn{border:1px solid rgba(255,255,255,.2);background:transparent;color:var(--bar-ink);border-radius:10px;padding:7px 12px;font-weight:600;font-size:13.5px}
.barbtn:hover{background:rgba(255,255,255,.08)}
@media (max-width:700px){.meter{display:none}.bar img{height:32px}}

.wrap{max-width:1280px;margin:0 auto;padding-block:22px 90px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h2.sec{font:700 13px var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 12px;display:flex;align-items:center;gap:10px}
h2.sec .cnt{font:700 12px var(--f-body);background:var(--sunk);color:var(--muted);border-radius:999px;padding:2px 9px;letter-spacing:0}

/* телевизори */
.tvs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-bottom:26px}
@media (max-width:560px){.tvs{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tv .cap{flex-direction:column;gap:0;padding:9px 11px}.tv .cap b{font-size:13px;max-width:100%}.tv .now{display:none}.tv.add{min-height:90px}}
.tv{position:relative;text-align:left;border:0;padding:0;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;
  outline:2px solid transparent;transition:outline-color .15s,transform .15s}
.tv:hover{transform:translateY(-2px)}
.tv[aria-pressed=true]{outline-color:var(--brand)}
.tv .scr{position:relative;aspect-ratio:16/9;background:#0d0b0a;display:grid;place-items:center;overflow:hidden}
.tv .scr img.th{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tv .scr .ph{width:34%;opacity:.5}
.tv .scr::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 55%,rgba(0,0,0,.55))}
.live{position:absolute;left:10px;top:10px;z-index:1;display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;
  background:rgba(0,0,0,.6);color:#fff;border-radius:999px;padding:4px 10px 4px 8px;backdrop-filter:blur(6px)}
.live i{width:8px;height:8px;border-radius:50%;background:#8b8580}
.live.on i{background:#3BDB84;box-shadow:0 0 0 0 rgba(59,219,132,.6);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(59,219,132,0)}100%{box-shadow:0 0 0 0 rgba(59,219,132,0)}}
.tv .now{position:absolute;left:12px;right:12px;bottom:8px;z-index:1;color:#fff;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.95}
.tv .cap{padding:12px 14px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tv .cap b{font:700 15px var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tv .cap span{font-size:12.5px;color:var(--muted);white-space:nowrap}
.tv.add{display:grid;place-items:center;min-height:150px;background:transparent;box-shadow:none;border:2px dashed var(--line);color:var(--muted);font-weight:700}
.tv.add:hover{border-color:var(--brand);color:var(--brand-ink)}

/* разположение */
.main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:22px;align-items:start}
@media (max-width:980px){.main{grid-template-columns:minmax(0,1fr)}}
.aside{position:sticky;top:84px;display:flex;flex-direction:column;gap:16px}
@media (max-width:980px){.aside{position:static;order:-1}}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}

/* преглед */
.monitor{background:#0d0b0a;border-radius:14px;padding:8px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.monitor iframe{display:block;width:100%;aspect-ratio:16/9;border:0;border-radius:8px;background:#000}
.monitor-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:var(--muted)}
.url{display:flex;gap:6px;align-items:center;margin-top:12px}
.url code{flex:1;min-width:0;background:var(--sunk);border-radius:10px;padding:9px 11px;font:600 13px ui-monospace,SFMono-Regular,Menlo,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* полета */
.fields{display:flex;flex-direction:column;gap:14px}
.f label,.flabel{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:6px}
.f input[type=text]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--surface);font-weight:600}
.seg{display:flex;background:var(--sunk);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 6px;font-weight:700;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.tog div b{display:block;font-weight:700;font-size:14px}
.tog div span{font-size:12.5px;color:var(--muted)}
.sw{position:relative;width:44px;height:26px;border-radius:13px;background:var(--line);border:0;padding:0;transition:.2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw[aria-pressed=true]{background:var(--brand)} .sw[aria-pressed=true]::after{left:21px}
.sw.ok[aria-pressed=true]{background:var(--ok)}

/* преходи */
.trans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tr{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 6px 7px;text-align:center;font-size:12px;font-weight:700;color:var(--muted)}
.tr[aria-pressed=true]{border-color:var(--brand);color:var(--ink);background:var(--brand-soft)}
.demo{position:relative;aspect-ratio:16/9;border-radius:7px;overflow:hidden;background:#000;margin-bottom:5px;perspective:300px}
.demo i{position:absolute;inset:0;display:grid;place-items:center;font:700 13px var(--f-display);color:#fff;font-style:normal;backface-visibility:hidden}
.demo .a{background:#3a332d}
.demo .b{background:var(--brand)}
.tr .demo i{animation-duration:2.6s;animation-iteration-count:infinite;animation-timing-function:cubic-bezier(.65,0,.35,1)}
.d-fade .b{animation-name:fadeB}
@keyframes fadeB{0%,40%{opacity:0}60%,100%{opacity:1}}
.d-slide .b{animation-name:slideB} .d-slide .a{animation-name:slideA}
@keyframes slideB{0%,40%{transform:translateX(100%)}60%,100%{transform:none}}
@keyframes slideA{0%,40%{transform:none}60%,100%{transform:translateX(-100%)}}
.d-up .b{animation-name:upB} .d-up .a{animation-name:upA}
@keyframes upB{0%,40%{transform:translateY(100%)}60%,100%{transform:none}}
@keyframes upA{0%,40%{transform:none}60%,100%{transform:translateY(-100%)}}
.d-zoom .b{animation-name:zoomB} .d-zoom .a{animation-name:zoomA}
@keyframes zoomB{0%,40%{opacity:0;transform:scale(1.35)}60%,100%{opacity:1;transform:none}}
@keyframes zoomA{0%,40%{opacity:1;transform:none}60%,100%{opacity:0;transform:scale(.8)}}
.d-blur .b{animation-name:blurB}
@keyframes blurB{0%,40%{opacity:0;filter:blur(8px)}60%,100%{opacity:1;filter:none}}
.d-wipe .b{animation-name:wipeB}
@keyframes wipeB{0%,40%{clip-path:inset(0 100% 0 0)}60%,100%{clip-path:inset(0)}}
.d-black .a{animation-name:blackA} .d-black .b{animation-name:blackB}
@keyframes blackA{0%,40%{opacity:1}50%,100%{opacity:0}}
@keyframes blackB{0%,50%{opacity:0}60%,100%{opacity:1}}
.d-flip .a{animation-name:flipA} .d-flip .b{animation-name:flipB}
@keyframes flipA{0%,40%{transform:none}50%,100%{transform:rotateY(90deg)}}
@keyframes flipB{0%,50%{transform:rotateY(-90deg)}60%,100%{transform:none}}
.d-cut .b{animation-name:cutB;animation-timing-function:steps(1,end)!important}
@keyframes cutB{0%,50%{opacity:0}50.1%,100%{opacity:1}}
.d-random .b{animation-name:rndB} .d-random .a{animation-name:rndA}
@keyframes rndB{0%,20%{transform:translateX(100%)}30%,55%{transform:none;opacity:1}70%,100%{opacity:0;transform:scale(1.3)}}
@keyframes rndA{0%,55%{opacity:0}70%,100%{opacity:1}}
@media (prefers-reduced-motion:reduce){.tr .demo i{animation:none!important}.live.on i{animation:none}}
.range{display:flex;align-items:center;gap:12px}
.range input{flex:1;accent-color:var(--brand)}
.range b{font-size:13px;min-width:44px;text-align:right}

/* качване */
.drop{position:relative;border:2px dashed color-mix(in srgb,var(--brand) 45%,var(--line));border-radius:var(--r);padding:26px 18px;text-align:center;cursor:pointer;
  background:linear-gradient(135deg,var(--brand-soft),transparent 70%);transition:.15s}
.drop:hover,.drop.over{border-color:var(--brand);transform:translateY(-1px)}
.drop .ic{width:46px;height:46px;border-radius:14px;background:var(--brand);color:#fff;display:grid;place-items:center;margin:0 auto 10px;font-size:24px;font-weight:700}
.drop strong{font:700 16px var(--f-display);display:block}
.drop .hint{font-size:13px;color:var(--muted);margin-top:4px}
.pick{margin-top:14px;display:flex;flex-direction:column;gap:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:6px 13px;font-size:13.5px;font-weight:700;background:var(--surface);color:var(--muted)}
.chip[aria-pressed=true]{border-color:var(--brand);background:var(--brand-soft);color:var(--ink)}
.files{font-size:13px;color:var(--muted)}
.progress{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--brand);transition:width .2s}

/* бутони */
.btn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:11px;padding:9px 15px;font-weight:700;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{filter:brightness(.95)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.btn.danger{color:var(--bad)} .btn.danger:hover{border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* табове */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:22px 0 14px}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:700;color:var(--muted);border-bottom:2.5px solid transparent;margin-bottom:-1px}
.tabs button[aria-pressed=true]{color:var(--ink);border-bottom-color:var(--brand)}

/* списък */
.loopbar{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;margin-bottom:6px;background:var(--sunk)}
.loopbar i{display:block;height:100%;background:var(--brand);opacity:.85}
.loopbar i.v{background:var(--ink);opacity:.75}
.loopinfo{font-size:12.5px;color:var(--muted);margin-bottom:14px}
.items{display:flex;flex-direction:column;gap:10px}
.item{display:grid;grid-template-columns:22px 150px minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--surface);border-radius:14px;padding:10px 12px 10px 6px;box-shadow:var(--shadow);transition:opacity .15s,transform .15s}
.item.off{opacity:.55}
.item.dragging{opacity:.4}
.item.over{transform:translateY(4px);box-shadow:0 -3px 0 var(--brand),var(--shadow)}
.grip{cursor:grab;color:var(--muted);display:grid;place-items:center;height:100%;font-size:15px;letter-spacing:-2px;user-select:none}
.th{position:relative;width:150px;aspect-ratio:16/9;border-radius:10px;background:var(--sunk);overflow:hidden;display:grid;place-items:center;font-size:12px;color:var(--muted);font-weight:700}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.th .kind{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.65);color:#fff;border-radius:6px;padding:1px 6px;font-size:11px;font-weight:800}
.th .n{position:absolute;left:6px;top:6px;background:var(--brand);color:#fff;border-radius:6px;min-width:22px;padding:1px 6px;font:700 11.5px var(--f-display);text-align:center}
.th.proc::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(243,127,40,.25),transparent);animation:sh 1.4s infinite}
@keyframes sh{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.meta{min-width:0;display:flex;flex-direction:column;gap:7px}
.meta .nm{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;gap:8px 12px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.row label{display:inline-flex;align-items:center;gap:5px}
.row input[type=number]{width:58px;padding:4px 6px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-weight:700}
.row input[type=date]{padding:3px 6px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:13px}
.row select{padding:4px 6px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:13px;font-weight:600}
.badge{display:inline-block;font-size:11.5px;font-weight:800;padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.badge.ok{background:var(--ok-soft);color:var(--ok)} .badge.warn{background:var(--warn-soft);color:var(--warn)} .badge.bad{background:var(--bad-soft);color:var(--bad)}
.acts{display:flex;gap:6px;align-items:center}
.ic{border:1px solid var(--line);background:var(--surface);border-radius:9px;width:34px;height:34px;display:grid;place-items:center;font-size:15px;padding:0;color:var(--ink)}
.ic:hover{border-color:var(--muted)} .ic.del:hover{border-color:var(--bad);color:var(--bad)}
.ic:disabled{opacity:.35;cursor:default}
.empty{text-align:center;color:var(--muted);padding:36px 16px;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow)}
.empty b{display:block;font:700 16px var(--f-display);color:var(--ink);margin-bottom:4px}
@media (max-width:680px){
  .item{grid-template-columns:96px minmax(0,1fr);padding:10px}
  .grip{display:none}
  .th{width:96px}
  .acts{grid-column:1/-1;justify-content:flex-end}
}

/* библиотека */
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.lc{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.lc .th{width:100%;border-radius:0}
.lc .b{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.lc .nm{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lc .use{color:var(--muted);font-size:12.5px}
.lc .r{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}

/* вход */
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at top,#3a2a1d 0,var(--bar) 60%)}
.login form{width:min(380px,100%);background:var(--surface);border-radius:22px;padding:30px 26px;box-shadow:0 30px 80px -30px rgba(0,0,0,.6);text-align:center}
.login img{width:150px;margin-bottom:6px}
.login h1{font:700 20px var(--f-display);margin:6px 0 2px}
.login p{color:var(--muted);margin:0 0 18px;font-size:14px}
.login input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:16px;margin-bottom:12px}
.login .btn{width:100%;justify-content:center;padding:13px}
.err{color:var(--bad);font-size:14px;min-height:1.3em;margin-top:10px}

/* диалог и съобщение */
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,8,6,.55);display:grid;place-items:center;padding:16px}
.modal[hidden]{display:none!important}
.modal .box{width:min(420px,100%);background:var(--surface);border-radius:18px;padding:22px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
.modal h3{font:700 17px var(--f-display);margin:0 0 8px}
.modal p{color:var(--muted);margin:0 0 14px;font-size:14px}
.modal input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:var(--surface);margin-bottom:14px;font-weight:600}
.modal .r{display:flex;gap:8px;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:60;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="app"></div>
<div class="modal" id="modal" hidden><div class="box"><h3 id="mT"></h3><p id="mP"></p><input id="mI" type="text" hidden><div class="r"><button class="btn" id="mNo">Откажи</button><button class="btn pri" id="mYes">Да</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
(() => {
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const BASE = window.EKRANI_BASE || location.origin;      // в прегледа сочи към истинския сървър
const MEDIA = window.EKRANI_MEDIA || (f => '/media/' + f);
let S = null, cur = null, files = [], upScreens = null, uploading = false, tab = 'list', busy = 0;
try { cur = localStorage.getItem('ekrani_screen'); } catch (e) {}

const TR = [
  ['fade', 'Плавно'], ['slide', 'Плъзгане'], ['up', 'Отдолу'], ['zoom', 'Приближаване'], ['blur', 'Размазване'],
  ['wipe', 'Завеса'], ['black', 'През черно'], ['flip', 'Обръщане'], ['cut', 'Рязко'], ['random', 'Различен']
];
const trName = k => (TR.find(t => t[0] === k) || [k, k])[1];

async function api(url, opts = {}) {
  const r = await fetch(url, { ...opts, headers: opts.body && !(opts.body instanceof FormData) ? { 'Content-Type': 'application/json' } : {} });
  if (r.status === 401) { S = null; renderLogin(); throw new Error('login'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Нещо се обърка. Опитай пак.');
  return j;
}
let tt; function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('show'), 2800); }

/* диалог вместо confirm/prompt */
function ask(title, text, { input, yes = 'Да', danger } = {}) {
  return new Promise(res => {
    const m = $('#modal'); $('#mT').textContent = title; $('#mP').textContent = text || '';
    const i = $('#mI'); i.hidden = input === undefined; i.value = input || '';
    const y = $('#mYes'); y.textContent = yes; y.className = 'btn ' + (danger ? 'danger' : 'pri');
    m.hidden = false; (input !== undefined ? i : y).focus();
    const done = v => { m.hidden = true; y.onclick = $('#mNo').onclick = m.onclick = null; i.onkeydown = null; res(v); };
    y.onclick = () => done(input !== undefined ? i.value.trim() || null : true);
    $('#mNo').onclick = () => done(null);
    m.onclick = e => { if (e.target === m) done(null); };
    i.onkeydown = e => { if (e.key === 'Enter') y.click(); if (e.key === 'Escape') done(null); };
  });
}

let lastJson = '';
async function refresh() {
  let j; try { j = await api('/api/state'); } catch (e) { return; }
  const k = JSON.stringify({ ...j, disk: 0 });
  if (k === lastJson && S) return;                 // нищо ново — не презареждай прегледа
  lastJson = k; S = j;
  if (!S.screens.some(s => s.id === cur)) cur = S.screens[0] && S.screens[0].id;
  render();
}

/* ---------- вход ---------- */
function renderLogin() {
  $('#app').innerHTML = `<div class="login"><form id="lf">
    <img src="/static/logo.png" alt="300 Триста">
    <h1>Екрани</h1><p>Рекламите по телевизорите в магазина</p>
    <input type="password" id="pw" placeholder="Парола" autocomplete="current-password" autofocus>
    <button class="btn pri">Влез</button><p class="err" id="le"></p></form></div>`;
  $('#lf').onsubmit = async e => { e.preventDefault();
    try { await api('/api/login', { method: 'POST', body: JSON.stringify({ password: $('#pw').value }) }); refresh(); }
    catch (er) { $('#le').textContent = er.message === 'login' ? 'Грешна парола' : er.message; } };
}

/* ---------- помощни ---------- */
const mb = b => b == null ? '—' : b >= 1e9 ? (b / 1e9).toFixed(1) + ' GB' : b >= 1e6 ? Math.round(b / 1e6) + ' MB' : Math.max(1, Math.round(b / 1e3)) + ' KB';
const media = id => S.media.find(m => m.id === id);
const today = () => new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Sofia' }).format(new Date());
const bgDate = d => d ? d.split('-').reverse().join('.') : '';
const mmss = s => { s = Math.round(s); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const isActive = i => { const m = media(i.mediaId), d = today(); return i.on && m && m.status === 'ready' && (!i.from || i.from <= d) && (!i.to || i.to >= d); };
const itemLen = i => { const m = media(i.mediaId); return m.type === 'video' ? (m.duration || 0) : i.seconds; };
const thumbUrl = m => m && m.status === 'ready' && m.thumb ? MEDIA(m.thumb) : '';
function thumb(m, n) {
  const k = m ? `<span class="kind">${m.type === 'video' ? '▶ ' + (m.duration ? mmss(m.duration) : 'видео') : 'снимка'}</span>` : '';
  const num = n ? `<span class="n">${n}</span>` : '';
  if (!m) return `<div class="th">изтрит${num}</div>`;
  if (m.status === 'processing') return `<div class="th proc">обработва се…${num}</div>`;
  if (m.status === 'error') return `<div class="th" style="color:var(--bad)">грешка${num}</div>`;
  const u = thumbUrl(m);
  return `<div class="th">${u ? `<img loading="lazy" src="${esc(u)}" alt="">` : ''}${num}${k}</div>`;
}
function status(i, m) {
  if (!m) return '';
  if (m.status === 'processing') return '<span class="badge warn">Обработва се</span>';
  if (m.status === 'error') return `<span class="badge bad" title="${esc(m.error)}">Грешка: ${esc((m.error || '').slice(0, 50))}</span>`;
  if (!i.on) return '<span class="badge">Спряно</span>';
  const d = today();
  if (i.from && i.from > d) return `<span class="badge warn">Тръгва на ${bgDate(i.from)}</span>`;
  if (i.to && i.to < d) return '<span class="badge">Изтекло</span>';
  if (i.to) return `<span class="badge ok">Върти се до ${bgDate(i.to)}</span>`;
  return '<span class="badge ok">Върти се</span>';
}
const usedOn = id => S.screens.filter(s => (S.playlists[s.id] || []).some(i => i.mediaId === id)).map(s => s.name);
function screenThumb(s) {
  const pl = S.playlists[s.id] || [];
  let m = s.current && S.media.find(x => x.name === s.current && x.status === 'ready');
  if (!m) { const a = pl.find(isActive); m = a && media(a.mediaId); }
  return thumbUrl(m);
}

/* ---------- изглед ---------- */
function render() {
  if (!S) return;
  const sc = S.screens.find(s => s.id === cur);
  const pl = sc ? (S.playlists[sc.id] || []) : [];
  const act = pl.filter(isActive);
  const loop = act.reduce((a, i) => a + itemLen(i), 0);
  const total = (S.disk.used || 0) + (S.disk.free || 0);
  const usedPct = total ? Math.max(2, Math.round(S.disk.used / total * 100)) : 0;

  $('#app').innerHTML = `
  <header class="bar"><div class="bar-in">
    <img src="/static/logo-white.png" alt="300 Триста">
    <div class="ttl">Екрани<small>в магазина</small></div>
    <div class="sp"></div>
    <div class="meter num" title="Място за файлове"><span>${mb(S.disk.used)}${S.disk.free != null ? ' от ' + mb(total) : ''}</span><div class="m"><i style="width:${usedPct}%"></i></div></div>
    ${S.queue ? `<span class="meter">Обработват се ${S.queue}</span>` : ''}
    <button class="barbtn" id="out">Изход</button>
  </div></header>

  <main class="wrap">
    <h2 class="sec">Телевизорите <span class="cnt">${S.screens.filter(s => s.online).length} от ${S.screens.length} онлайн</span></h2>
    <section class="tvs">${S.screens.map(s => { const u = screenThumb(s), n = (S.playlists[s.id] || []).filter(isActive).length; return `
      <button class="tv" data-tab="${esc(s.id)}" aria-pressed="${s.id === cur}">
        <div class="scr">${u ? `<img class="th" src="${esc(u)}" alt="">` : `<img class="ph" src="/static/logo-white.png" alt="">`}
          <span class="live ${s.online ? 'on' : ''}"><i></i>${s.online ? 'Наживо' : 'Офлайн'}</span>
          ${s.online && s.current ? `<span class="now">▶ ${esc(s.current)}</span>` : ''}</div>
        <div class="cap"><b>${esc(s.name)}</b><span class="num">${n} ${n === 1 ? 'клип' : 'клипа'}</span></div>
      </button>`; }).join('')}
      <button class="tv add" id="addScr">+ Добави телевизор</button>
    </section>

    ${sc ? `<div class="main">
      <div>
        <div class="drop" id="drop"><div class="ic">+</div><strong>Качи видео или снимка</strong>
          <div class="hint">Направо от телефона: MP4, MOV, JPG, PNG. Видеата се оправят сами за телевизора.</div></div>
        <input type="file" id="fi" multiple accept="video/*,image/*" hidden>
        ${files.length ? `<div class="pick card">
          <div class="files"><b style="color:var(--ink)">${files.length} ${files.length === 1 ? 'файл' : 'файла'}</b> · ${mb(files.reduce((a, f) => a + f.size, 0))} · ${esc(files.slice(0, 3).map(f => f.name).join(', '))}${files.length > 3 ? '…' : ''}</div>
          <div><span class="flabel">На кои телевизори да се въртят</span><div class="chips">${S.screens.map(s => `<button class="chip" data-up="${esc(s.id)}" aria-pressed="${upScreens.includes(s.id)}">${esc(s.name)}</button>`).join('')}</div></div>
          <div class="progress"><i id="upBar"></i></div><div class="files" id="upTxt"></div>
          <div class="chips"><button class="btn pri" id="upGo"${uploading ? ' disabled' : ''}>Качи</button><button class="btn" id="upX"${uploading ? ' disabled' : ''}>Откажи</button></div>
        </div>` : ''}

        <nav class="tabs"><button data-t="list" aria-pressed="${tab === 'list'}">Върти се на „${esc(sc.name)}“</button><button data-t="lib" aria-pressed="${tab === 'lib'}">Библиотека (${S.media.length})</button></nav>

        ${tab === 'list' ? `
          ${act.length ? `<div class="loopbar">${act.map(i => `<i class="${media(i.mediaId).type === 'video' ? 'v' : ''}" style="flex:${Math.max(1, itemLen(i))}" title="${esc(media(i.mediaId).name)}"></i>`).join('')}</div>
          <div class="loopinfo num">${act.length} активни · един кръг трае <b style="color:var(--ink)">${mmss(loop)}</b> · за час се върти около ${loop ? Math.floor(3600 / loop) : 0} пъти</div>` : ''}
          <div class="items" id="items">${pl.length ? pl.map((i, n) => { const m = media(i.mediaId); return `
            <div class="item ${i.on ? '' : 'off'}" data-i="${n}" draggable="true">
              <div class="grip" title="Влачи за подреждане">⋮⋮</div>
              ${thumb(m, n + 1)}
              <div class="meta">
                <span class="nm" title="${esc(m && m.name)}">${esc(m ? m.name : 'Изтрит файл')}</span>
                <div class="row">${status(i, m)}
                  ${m && m.type === 'image' ? `<label>стои <input type="number" min="3" max="600" value="${i.seconds}" data-f="seconds"> сек</label>` : ''}
                  <label>преход <select data-f="transition"><option value="">като екрана (${esc(trName(sc.transition))})</option>${TR.map(t => `<option value="${t[0]}"${i.transition === t[0] ? ' selected' : ''}>${t[1]}</option>`).join('')}</select></label></div>
                <div class="row"><label>от <input type="date" value="${esc(i.from)}" data-f="from"></label><label>до <input type="date" value="${esc(i.to)}" data-f="to"></label></div>
              </div>
              <div class="acts">
                <button class="sw ok" data-a="on" aria-pressed="${i.on}" title="${i.on ? 'Спри' : 'Пусни'}" aria-label="Вкл / изкл"></button>
                <button class="ic" data-a="up" title="Нагоре" aria-label="Нагоре"${n === 0 ? ' disabled' : ''}>↑</button>
                <button class="ic" data-a="down" title="Надолу" aria-label="Надолу"${n === pl.length - 1 ? ' disabled' : ''}>↓</button>
                <button class="ic del" data-a="rm" title="Махни от този телевизор" aria-label="Махни">✕</button>
              </div>
            </div>`; }).join('') : `<div class="empty"><b>Този телевизор още е празен</b>Качи видео или снимка горе, или добави от библиотеката.</div>`}</div>`
        : `<div class="lib">${S.media.length ? S.media.slice().reverse().map(m => { const u = usedOn(m.id), here = pl.some(i => i.mediaId === m.id); return `
            <div class="lc">${thumb(m)}<div class="b">
              <span class="nm" title="${esc(m.name)}">${esc(m.name)}</span>
              <span class="use">${m.size ? mb(m.size) + ' · ' : ''}${u.length ? 'на ' + esc(u.join(', ')) : 'не се върти никъде'}</span>
              <div class="r"><button class="btn sm${here ? '' : ' pri'}" data-add="${esc(m.id)}">${here ? 'Добави пак' : '+ Добави тук'}</button>
                <button class="btn sm" data-ren="${esc(m.id)}">Име</button><button class="btn sm danger" data-del="${esc(m.id)}">Изтрий</button></div>
            </div></div>`; }).join('') : '<div class="empty"><b>Библиотеката е празна</b>Всичко качено се появява тук.</div>'}</div>`}
      </div>

      <aside class="aside">
        <div class="card">
          <h2 class="sec">Наживо · ${esc(sc.name)}</h2>
          <div class="monitor"><iframe id="pv" src="${esc(BASE)}/tv/${esc(sc.id)}?preview=1" title="Преглед на екрана" loading="lazy"></iframe></div>
          <div class="monitor-foot"><span>${sc.online ? `<b style="color:var(--ok)">● Телевизорът е онлайн</b>` : sc.lastSeen ? 'Офлайн от ' + new Date(sc.lastSeen).toLocaleString('bg-BG', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : 'Телевизорът още не е свързан'}</span>
            <a class="btn sm" href="${esc(BASE)}/tv/${esc(sc.id)}" target="_blank" rel="noopener">Цял екран</a></div>
          <div class="url"><code>${esc(BASE.replace(/^https?:\/\//, ''))}/tv/${esc(sc.id)}</code><button class="btn sm" id="copy">Копирай</button></div>
        </div>

        <div class="card fields">
          <h2 class="sec" style="margin:0">Настройки на екрана</h2>
          <div class="f"><label for="scName">Име на сектора</label><input type="text" id="scName" value="${esc(sc.name)}"></div>
          <div><span class="flabel">Картина</span><div class="seg"><button data-fit="contain" aria-pressed="${sc.fit === 'contain'}">Цялата</button><button data-fit="cover" aria-pressed="${sc.fit === 'cover'}">Запълни екрана</button></div></div>
          <div class="tog"><div><b>Звук на видеата</b><span>Само в приложението на телевизора</span></div><button class="sw" data-set="sound" aria-pressed="${!!sc.sound}" aria-label="Звук"></button></div>
          <div class="tog"><div><b>Лого 300 в ъгъла</b><span>Горе вдясно, върху всичко</span></div><button class="sw" data-set="logo" aria-pressed="${!!sc.logo}" aria-label="Лого"></button></div>
          <div class="tog"><div><b>Живи снимки</b><span>Бавно приближаване на снимките</span></div><button class="sw" data-set="kenburns" aria-pressed="${sc.kenburns !== false}" aria-label="Живи снимки"></button></div>
        </div>

        <div class="card fields">
          <h2 class="sec" style="margin:0">Преход между клиповете</h2>
          <div class="trans">${TR.map(([k, n]) => `<button class="tr d-${k}" data-tr="${k}" aria-pressed="${sc.transition === k}"><div class="demo"><i class="a">A</i><i class="b">B</i></div>${n}</button>`).join('')}</div>
          <div><span class="flabel">Продължителност на прехода</span><div class="range"><input type="range" id="tdur" min="0.3" max="3" step="0.1" value="${sc.tdur || 1}"><b class="num" id="tdurV">${(sc.tdur || 1).toFixed(1)} сек</b></div></div>
        </div>

        <button class="btn danger" id="delScr" style="align-self:flex-start">Премахни „${esc(sc.name)}“</button>
      </aside>
    </div>` : ''}
  </main>`;
  bind(sc, pl);
}

/* ---------- действия ---------- */
async function savePl(pl) {
  S.playlists[cur] = pl; render();
  busy++;
  try { await api('/api/playlists/' + encodeURIComponent(cur), { method: 'PUT', body: JSON.stringify(pl) }); }
  catch (e) { if (e.message !== 'login') toast(e.message); refresh(); }
  finally { busy--; }
}
async function patchScreen(body, quiet) {
  const sc = S.screens.find(s => s.id === cur); Object.assign(sc, body); if (!quiet) render();
  try { await api('/api/screens/' + encodeURIComponent(cur), { method: 'PATCH', body: JSON.stringify(body) }); }
  catch (e) { toast(e.message); refresh(); }
}

function bind(sc, pl) {
  $('#out').onclick = async () => { await api('/api/logout', { method: 'POST' }).catch(() => {}); renderLogin(); };
  $$('[data-tab]').forEach(b => b.onclick = () => { cur = b.dataset.tab; try { localStorage.setItem('ekrani_screen', cur); } catch (e) {} render(); });
  $('#addScr').onclick = async () => { const j = await api('/api/screens', { method: 'POST' }); cur = j.id; toast('Добавен е нов телевизор'); refresh(); };
  if (!sc) return;

  $$('[data-t]').forEach(b => b.onclick = () => { tab = b.dataset.t; render(); });
  $('#scName').onchange = e => { patchScreen({ name: e.target.value }); toast('Името е запазено'); };
  $$('[data-fit]').forEach(b => b.onclick = () => patchScreen({ fit: b.dataset.fit }));
  $$('[data-set]').forEach(b => b.onclick = () => patchScreen({ [b.dataset.set]: b.getAttribute('aria-pressed') !== 'true' }));
  $$('[data-tr]').forEach(b => b.onclick = () => { patchScreen({ transition: b.dataset.tr }); toast('Преход: ' + trName(b.dataset.tr)); });
  const td = $('#tdur');
  td.oninput = () => { $('#tdurV').textContent = (+td.value).toFixed(1) + ' сек'; };
  td.onchange = () => patchScreen({ tdur: +td.value }, true);
  $('#copy').onclick = () => {
    const u = BASE + '/tv/' + sc.id;
    navigator.clipboard.writeText(u).then(() => toast('Адресът е копиран'), () => { const r = document.createRange(); r.selectNodeContents($('.url code')); getSelection().removeAllRanges(); getSelection().addRange(r); });
  };
  $('#delScr').onclick = async () => {
    if (!await ask(`Да премахна „${sc.name}“?`, 'Файловете остават в библиотеката. Телевизорът ще покаже „Няма екран“.', { yes: 'Премахни', danger: true })) return;
    await api('/api/screens/' + encodeURIComponent(sc.id), { method: 'DELETE' }); cur = null; refresh();
  };

  // списък
  $$('.item').forEach(row => {
    const n = +row.dataset.i;
    row.querySelectorAll('[data-f]').forEach(inp => inp.onchange = () => {
      const p = pl.map(x => ({ ...x })); p[n][inp.dataset.f] = inp.dataset.f === 'seconds' ? +inp.value : inp.value;
      if (p[n].from && p[n].to && p[n].from > p[n].to) { toast('Крайната дата е преди началната'); render(); return; }
      savePl(p);
    });
    row.querySelectorAll('[data-a]').forEach(b => b.onclick = async () => {
      const p = pl.map(x => ({ ...x })), a = b.dataset.a;
      if (a === 'on') p[n].on = !p[n].on;
      else if (a === 'up' && n > 0) [p[n - 1], p[n]] = [p[n], p[n - 1]];
      else if (a === 'down' && n < p.length - 1) [p[n + 1], p[n]] = [p[n], p[n + 1]];
      else if (a === 'rm') { const m = media(p[n].mediaId); if (!await ask('Да махна от този телевизор?', `„${m ? m.name : ''}“ остава в библиотеката.`, { yes: 'Махни' })) return; p.splice(n, 1); }
      savePl(p);
    });
    // влачене за подреждане
    row.addEventListener('dragstart', e => { if (/INPUT|SELECT/.test(e.target.tagName)) return e.preventDefault(); row.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', n); });
    row.addEventListener('dragend', () => { row.classList.remove('dragging'); $$('.item.over').forEach(x => x.classList.remove('over')); });
    row.addEventListener('dragover', e => { e.preventDefault(); row.classList.add('over'); });
    row.addEventListener('dragleave', () => row.classList.remove('over'));
    row.addEventListener('drop', e => { e.preventDefault(); row.classList.remove('over');
      const from = +e.dataTransfer.getData('text/plain'); if (isNaN(from) || from === n) return;
      const p = pl.map(x => ({ ...x })); const [it] = p.splice(from, 1); p.splice(n, 0, it); savePl(p); });
  });

  // библиотека
  $$('[data-add]').forEach(b => b.onclick = () => { savePl([...pl, { id: '', mediaId: b.dataset.add, seconds: 10, from: '', to: '', on: true, transition: '' }]); toast('Добавено в края на „' + sc.name + '“'); });
  $$('[data-ren]').forEach(b => b.onclick = async () => {
    const m = media(b.dataset.ren); const v = await ask('Ново име', '', { input: m.name, yes: 'Запази' }); if (!v) return;
    await api('/api/media/' + m.id, { method: 'PATCH', body: JSON.stringify({ name: v }) }); refresh();
  });
  $$('[data-del]').forEach(b => b.onclick = async () => {
    const m = media(b.dataset.del), u = usedOn(m.id);
    if (!await ask(`Да изтрия „${m.name}“?`, u.length ? 'Ще се махне и от: ' + u.join(', ') + '. Не може да се върне.' : 'Не може да се върне.', { yes: 'Изтрий', danger: true })) return;
    await api('/api/media/' + m.id, { method: 'DELETE' }); toast('Изтрито'); refresh();
  });

  // качване
  const drop = $('#drop'), fi = $('#fi');
  drop.onclick = () => fi.click();
  const setFiles = list => { files = list; upScreens = [cur]; render(); };
  fi.onchange = () => setFiles([...fi.files]);
  drop.ondragover = e => { if (e.dataTransfer.types.includes('Files')) { e.preventDefault(); drop.classList.add('over'); } };
  drop.ondragleave = () => drop.classList.remove('over');
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); const l = [...e.dataTransfer.files].filter(f => /^(video|image)\//.test(f.type)); if (l.length) setFiles(l); };
  $$('[data-up]').forEach(b => b.onclick = () => { const id = b.dataset.up; upScreens = upScreens.includes(id) ? upScreens.filter(x => x !== id) : [...upScreens, id]; b.setAttribute('aria-pressed', upScreens.includes(id)); });
  const x = $('#upX'); if (x) x.onclick = () => { files = []; render(); };
  const go = $('#upGo'); if (go) go.onclick = doUpload;
}

function doUpload() {
  const fd = new FormData();
  fd.append('screens', JSON.stringify(upScreens));
  files.forEach(f => fd.append('files', f, f.name));
  uploading = true; $('#upGo').disabled = true; $('#upX').disabled = true;
  const xhr = new XMLHttpRequest();
  xhr.open('POST', '/api/upload');
  xhr.upload.onprogress = e => { if (!e.lengthComputable) return; const p = Math.round(e.loaded / e.total * 100);
    $('#upBar').style.width = p + '%'; $('#upTxt').textContent = `Качване ${p}% · ${mb(e.loaded)} от ${mb(e.total)}. Не затваряй страницата.`; };
  const fail = t => { uploading = false; $('#upTxt').textContent = t; $('#upGo').disabled = false; $('#upX').disabled = false; };
  xhr.onload = () => {
    if (xhr.status === 401) { uploading = false; return renderLogin(); }
    if (xhr.status >= 300) { let m = 'Качването не мина. Опитай пак.'; try { m = JSON.parse(xhr.responseText).error || m; } catch (e) {} return fail(m); }
    uploading = false; files = []; tab = 'list'; toast('Качено. Видеата тръгват след обработката.'); refresh(); };
  xhr.onerror = () => fail('Връзката прекъсна. Опитай пак.');
  xhr.send(fd);
}

// опресняване: често, докато нещо се обработва; не пречи, докато пишеш, влачиш или качваш
let lastRefresh = Date.now();
setInterval(() => {
  if (!S || uploading || files.length || busy || !$('#modal').hidden || $('.item.dragging')) return;
  const a = document.activeElement; if (a && /INPUT|SELECT/.test(a.tagName)) return;
  if (S.queue || Date.now() - lastRefresh > 20000) { lastRefresh = Date.now(); refresh(); }
}, 5000);

refresh();
})();
</script>
